<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云探校 · 招生开放日线上展厅｜江苏省张家港中等专业学校</title>
<meta name="description" content="不用等到开放日，也不用赶一趟车。三百六十亩校园、二十八个专业、一整面奖牌墙，在线上一次看完。">
<meta name="theme-color" content="#FAF8F3">
<link rel="icon" href="assets/img/emblem.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="sky__c sky__c--1"></span>
  <span class="sky__c sky__c--2"></span>
  <span class="sky__c sky__c--3"></span>
  <span class="sky__c sky__c--4"></span>
  <span class="sky__c sky__c--5"></span>
</div>

<!-- 页头：内容由 site.js 按 content.json 渲染 -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="brand" href="#top" aria-label="回到首屏">
      <img id="brandImg" src="assets/img/emblem.png" alt="校徽">
      <span class="brand__txt">
        <span class="brand__cn" id="brandCn">云探校</span>
        <span class="brand__en" id="brandEn">CAMPUS ONLINE</span>
      </span>
    </a>
    <nav class="nav__links" id="navLinks" aria-label="页面导航"></nav>
    <a class="nav__cta" id="navCta" href="#admit">
      <span id="navCtaTx">预约看校</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
    </a>
    <button class="nav__burger" id="burger" aria-label="打开菜单" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
    </button>
  </div>
</header>

<div class="drawer" id="drawer">
  <div class="drawer__hd">
    <span>目录</span>
    <button id="drawerClose" aria-label="关闭菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <nav class="drawer__nav" id="drawerNav"></nav>
  <p class="drawer__ft" id="drawerFoot"></p>
</div>

<!-- 正文：整页由 content.json 驱动，后台改完刷新即变 -->
<main id="app">
  <noscript>
    <div class="wrap" style="padding:120px 0">
      <h1 class="sec__h">需要开启 JavaScript</h1>
      <p class="sec__lead" style="margin-top:16px">这个展厅的内容由本地数据文件渲染。请在浏览器设置里启用 JavaScript，或改用 Chrome / Edge / Safari 打开。</p>
    </div>
  </noscript>
</main>

<footer class="foot" id="foot"></footer>

<!-- 问校园 -->
<div class="askbox" id="askbox" aria-hidden="true">
  <div class="askbox__veil" data-ask-close></div>
  <section class="askbox__panel" role="dialog" aria-modal="true" aria-label="校园问答">
    <header class="askbox__hd">
      <div class="askbox__ttl">
        <b id="askTitle">问校园</b>
        <span id="askSub">关于这所学校最常被问到的几件事，先在这里问</span>
      </div>
      <div class="askbox__acts">
        <button class="askbox__x askbox__x--plain" type="button" id="askClear">清空</button>
        <button class="askbox__x" type="button" data-ask-close>退出</button>
      </div>
    </header>
    <div class="askbox__log" id="askLog"></div>
    <div class="askbox__chips" id="askChips"></div>
    <form class="askbox__form" id="askForm">
      <input id="askInput" type="text" placeholder="比如：学校有几个食堂？" autocomplete="off" maxlength="60" aria-label="输入你的问题">
      <button type="submit">发送</button>
    </form>
  </section>
</div>

<button class="ask" id="askOpen" type="button" aria-label="打开校园问答">
  <span class="ask__seal">问</span>
  <span class="ask__tx"><b>问校园</b><span>食堂 · 系部 · 招生</span></span>
</button>

<script src="assets/js/site-data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
